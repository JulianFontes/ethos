# Alpha sweep (calibration) for activation steering on gpt-oss-20b: which strengths change the TOXIC / NOT TOXIC answers
# without breaking them. No-value prompt only, the fairness vector at layers 11-16, alpha = a fraction of the steered
# layers' mean hidden-state norm (meta.json `norms`), in both directions, on the first 20 comments of the band-balanced
# order. Plot with scripts/plots/plot_steering_sweep.py.
#   scripts/shell/submit_vllm.sh --config configs/gpt_oss_20b/alpha_sweep.yaml [--dry-run]

model: openai/gpt-oss-20b                    # Hugging Face id, served by vLLM (MXFP4 MoE, ~13 GB; 3.6B active parameters)
sample: data/processed/consensus_n1000_train/sample.csv
data: data/processed/consensus_n1000_train/steering_alpha_sweep_gpt_oss_20b_fine
# Earlier: _v2 (fractions +-0.5 / 0.25 / 0.1 / 0.05) broke at -0.1 and stronger (<= 4% valid answers; results in
# data/experiments/05_activation_steering/alpha_sweep_gpt_oss_20b/coarse/); v1 (no token limits) stalled at -0.5.
ids: [5554606, 1083017, 621351, 591640, 5274283, 6279132, 5464059, 5192086, 726270, 896216,   # first 20 of order.csv
      4975044, 5325266, 5120093, 5736820, 5166965, 5096575, 5780838, 5648853, 5624392, 5542520]   # (4 per band)

# What to ask (see profile_signal.py)
single_values: true
conditions: [none]                         # only the no-value prompt: any change comes from the activation steering
samples: 10                                # answers per comment and condition
reasoning_effort: low                      # gpt-oss always reasons; low is its cheapest setting
workers: 64                                # requests in flight = vLLM --max-num-seqs
checkpoint_every: 100                      # comments per checkpoint when merging
# Limits, so over-steered settings fail fast (in v1, alpha -0.5 broke 65 of 66 calls, each running to 4096 tokens and
# retried up to 9 times). The failure rate is part of what the sweep measures, so every call gets one try.
max_tokens: 1024                           # per answer, reasoning included (normal answers use ~220)
attempts: 1                                # tries per call
passes: 1                                  # no second pass over failed calls

# Activation steering (plugins/vllm_steer; vectors from scripts/shell/fit_steering_vectors.sh)
steering:
  defaults: configs/gpt_oss_20b/steering.yaml   # vectors and layers (11-16); the sweep overrides the strengths
  values: [fairness]
  alpha_fractions: [0, -0.05, -0.03, -0.02, -0.01, 0.01, 0.02, 0.03, 0.05]   # x mean norm (~2290); 0 = unsteered

# Cluster
job_size: 500                              # comments per job (= per node): one job runs all 9 settings
max_nodes: 1
time: "04:00:00"                           # ~5 min per setting (server start) + answers; strong steering can be slow
partition: gpu_test                        # 20 GB A100 MIG slice; ~13 GB of weights leaves ~4-5 GB for KV cache
account: protopapas_lab
scratch: /n/netscratch/protopapas_lab/Lab/$USER   # vLLM and model downloads (several GB + ~16 GB) are cached here
