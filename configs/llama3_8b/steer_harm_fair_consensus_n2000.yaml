# Activation steering with harmfulness and fairness (with toxicity, GPT's 3 most-picked values: value_selection/) on
# Meta-Llama-3-8B-Instruct, on the same 2,000 comments and strength grid as steer_toxicity_consensus_n2000.yaml, so a
# policy can pick a value and a strength per comment. No unsteered setting: the toxicity run already has it, and
# combine_steering_runs.py refuses repeated settings.
#   scripts/shell/submit_vllm.sh --config configs/llama3_8b/steer_harm_fair_consensus_n2000.yaml [--dry-run]
# then combine with the toxicity run:
#   python scripts/experiments/combine_steering_runs.py --sample data/processed/civil-comments/consensus_n2000_train/sample.csv \
#       --runs <toxicity grid run> <this run> --out data/processed/civil-comments/consensus_n2000_train/steer_top3_llama3_8b_l10-25_grid

model: meta-llama/Meta-Llama-3-8B-Instruct  # Hugging Face id, served by vLLM (bf16, ~16 GB)
sample: data/processed/civil-comments/consensus_n2000_train/sample.csv
data: data/processed/civil-comments/consensus_n2000_train/steer_harm_fair_llama3_8b_l10-25_grid

# What to ask (see profile_signal.py)
single_values: true
conditions: [none]                         # only the no-value prompt: any change comes from the activation steering
samples: 10                                # answers per comment and condition
reasoning_effort: none                     # Llama 3 does not reason before answering
workers: 64                                # requests in flight = vLLM --max-num-seqs
checkpoint_every: 100
max_tokens: 512                            # answers use ~60 (longest seen 556); stops calls stuck writing JSON whitespace

# Activation steering: toxicity's grid (+-0.35 kept its rationales coherent; check sweep_values.yaml for these two),
# coarse to fine so a run still in progress already covers the range
steering:
  vectors: data/processed/steering_vectors/Meta-Llama-3-8B-Instruct
  layers: "10-25"
  values: [harmfulness, fairness]
  alphas: [-0.35, 0.35, -0.2, 0.2, -0.1, 0.1, -0.3, 0.3, -0.15, 0.15, -0.05, 0.05, -0.25, 0.25]

# Cluster
job_size: 1000                             # comments per job: 2 jobs (gpu_test lets 2 of your jobs queue at once)
max_nodes: 2
time: "12:00:00"                           # ~5 h expected (280,000 answers per job at ~16/s); requeued if it runs out
partition: gpu_test
account: protopapas_lab
scratch: /n/netscratch/protopapas_lab/Lab/$USER
