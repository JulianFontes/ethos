# Config for scripts/data/extract_splits.py: train/test datasets from Jigsaw's own train/test split.

min_annotators: 30    # minimum toxicity_annotator_count (inclusive)
top_level_only: true  # keep parent (top-level) comments only: drop replies (parent_id set)
drop_test_overlap: true  # drop test comments whose text also appears in train (avoids leakage)

output_dir: data/processed/civil-comments/comments   # relative to the project root
