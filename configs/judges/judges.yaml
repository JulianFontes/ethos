# Every judge, run in order by scripts/judge.py. Each `name` is the value written to the `judge` column; `type`
# picks the implementation (human, detoxify, ollama_minimal / openai_minimal).
# Older judges (allow/remove base and DMP, annotator-instruction judges) are archived in .archive/configs/judges/judges.yaml.
# Fixed-profile experiments run through scripts/experiments/profile_signal.py instead.

# Sample to judge: its sample.csv (comments and human labels); results go to data/judgements/<folder name>/.
sample_dir: data/processed/civil-comments/consensus_n125_test

# Settings shared by the Ollama judges; a judge's own settings override them.
llm_defaults:
  base_url: http://localhost:11434/v1        # Ollama's OpenAI-compatible endpoint
  reasoning_effort: none                     # thinking off (remove for model defaults)

judges:
  # Human annotations from Civil Comments.
  - name: human
    type: human
    threshold: 0.5                           # share of annotators rating it toxic >= threshold -> "remove"

  # Toxicity classifier baseline.
  - name: detoxify
    type: detoxify
    checkpoint: unbiased                     # trained on the Civil Comments train split; our samples are test-only
    threshold: 0.5                           # toxicity >= threshold -> "remove"

  # Minimal judge: short TOXIC / NOT TOXIC prompt (prompts/judge_minimal.txt), rated `samples` times;
  # score = share TOXIC. On the OpenAI API that is `samples` paid calls per comment.
  - name: gpt-6-luna-base
    type: openai_minimal
    model: gpt-6-luna
    prompt: prompts/judge_minimal.txt
    samples: 10
    temperature: 1.0                         # > 0 so repeated ratings can differ
    reasoning_effort: none
    threshold: 0.5
    workers: 8

  # The same judge with Dynamic Moral Profiling: each of the `samples` ratings gets its own random 10-value profile
  # (prompts/judge_minimal_pluralistic.txt). Compare with gpt-6-luna-base to see how much profiles shift answers.
  - name: gpt-6-luna-dmp-random
    type: openai_minimal_dmp
    model: gpt-6-luna
    prompt: prompts/judge_minimal_pluralistic.txt
    values: prompts/profiles/taxonomy-values.txt
    top_k: 10
    equal_weights: true
    seed: 0                                  # rating i uses seed + i, combined with the comment id
    samples: 10
    temperature: 1.0
    reasoning_effort: none
    threshold: 0.5
    workers: 8
