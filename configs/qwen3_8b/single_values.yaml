# A distributed run of scripts/experiments/profile_signal.py on the cluster, submitted with
#   scripts/shell/submit_vllm.sh --config configs/qwen3_8b/single_values.yaml [--dry-run]
# Each job is one Slurm array task (submitted with submitit): one A100 that starts its own vLLM server and handles
# every Nth comment of a fixed, band-balanced order. A job that runs out of time is requeued and resumes.
# Combine the jobs any time with the merge command the script prints.

model: Qwen/Qwen3-8B-FP8                   # Hugging Face id, served by vLLM (FP8 weights, ~9 GB; bf16 Qwen/Qwen3-8B is ~16 GB)
sample: data/processed/civil-comments/consensus_n1000_train/sample.csv
data: data/processed/civil-comments/consensus_n1000_train/single_values_qwen3_8b_fp8   # answers, scores and checkpoints go here
# ids: [240450, 1020342]                   # optional: only these comments (default: every comment in the sample)

# What to ask (see profile_signal.py)
single_values: true                        # each of the 60 taxonomy values alone (false: the profiles in prompts/profiles)
samples: 10                                # answers per comment and condition
reasoning_effort: none                     # none = thinking off (Qwen3); low / medium / high for gpt-oss
workers: 256                               # requests in flight per node = vLLM --max-num-seqs (gpu_test: ~128; full A100 on gpu: ~256)
checkpoint_every: 100                      # comments per checkpoint when merging

# Cluster
job_size: 500                              # comments per job (= per node). Keep the job count (2) when resuming: job i of N owns its comments
max_nodes: 2                               # never more jobs than this; bigger jobs instead
time: "04:00:00"                           # per job (resumed runs need less)
partition: seas_gpu                         # SEAS A100 80GB / H200 nodes (gpu_test: 20 GB MIG slice, max 2 jobs per user, 12 h)
account: protopapas_lab
scratch: /n/netscratch/protopapas_lab/Lab/$USER   # vLLM and model downloads (several GB + ~16 GB) are cached here
