[project]
name = "ethos"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "detoxify",
    "matplotlib",
    "openai",
    "pandas",
    "pyarrow>=26.0.1",
    "pyyaml",
    "sentence-transformers>=6.2.0",
    "submitit>=1.5.4",
    "tqdm",
    "transformers",
    "umap-learn>=0.5.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ethos"]

[dependency-groups]
dev = [
    "ipykernel",
    "nbformat>=5.11.1",
    "plotly>=7.1.0",
]
