[project]
name = "ethos"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "matplotlib",
    "openai",
    "pandas",
    "pyyaml",
    "tqdm",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ethos"]

[dependency-groups]
dev = [
    "ipykernel",
]
