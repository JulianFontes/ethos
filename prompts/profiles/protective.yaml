# Protective profile: favours safety, care, and protection from harm (steers toward TOXIC).
# value: weight. Values must be in prompts/taxonomy-values.txt; weights are rescaled to sum to 1.
# Judges with `equal_weights: true` ignore these weights and give every value the same weight.
values:
  Safety: 0.20
  Well-being: 0.18
  Care: 0.16
  Inclusivity: 0.14
  Respect: 0.12
  Freedom: 0.05
  Autonomy: 0.05
  Individualism: 0.04
  Privacy: 0.03
  Creativity: 0.03